<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>DBT Companion</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.58.0/build/stlite.css" />
    <style>
      /* Keep outer viewport fixed */
      html, body, #root {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
      }

      /* Disable Chrome mobile scroll anchoring without breaking scroll behavior */
      html, body, #root, .stApp, [data-testid="stAppViewContainer"], [data-testid="stMain"], section.main {
        overflow-anchor: none !important;
      }

      /* Ensure the Streamlit container is allowed to scroll smoothly */
      [data-testid="stAppViewContainer"] {
        overflow-y: auto !important;
        -webkit-overflow-scrolling: touch;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.58.0/build/stlite.js"></script>
    <script>
      // Global listener to force mobile scroll to top from anywhere in Pyodide/Streamlit
      window.addEventListener("message", (event) => {
        if (event.data === "SCROLL_TOP") {
          if (document.activeElement && document.activeElement.blur) {
            document.activeElement.blur();
          }

          const targets = [
            document.querySelector('[data-testid="stAppViewContainer"]'),
            document.querySelector('[data-testid="stMain"]'),
            document.querySelector('section.main'),
            document.getElementById('root'),
            document.body,
            document.documentElement
          ];

          targets.forEach(el => {
            if (el) {
              el.scrollTop = 0;
              if (el.scrollTo) el.scrollTo({ top: 0, left: 0, behavior: "instant" });
            }
          });
          window.scrollTo(0, 0);
        }
      });

      const imageNames = [
        "wise_mind.jpg", "please.jpg", "stop.jpg", "tipp.gif",
        "pros_cons.jpg", "distract.jpg", "improve.jpg", "self_soothe.jpg",
        "validation.jpg", "radical_acceptance.jpg", "describing_emotion.jpg",
        "check_the_facts.jpg", "opposite_action.jpg", "problem_solving.jpg",
        "positive_experiences.jpg", "building_mastery.jpg", "cope_ahead.jpg",
        "dearman.jpg", "give.jpg", "fast.jpg"
      ];

      async function initApp() {
        const fileMounts = {};

        // 1. Fetch and mount app.py
        const appRes = await fetch("./app.py");
        fileMounts["app.py"] = await appRes.text();

        // 2. Fetch and mount each image binary
        await Promise.all(
          imageNames.map(async (name) => {
            try {
              const res = await fetch(`./assets/${name}`);
              const buffer = await res.arrayBuffer();
              fileMounts[`assets/${name}`] = new Uint8Array(buffer);
            } catch (err) {
              console.warn(`Could not preload asset: ${name}`, err);
            }
          })
        );

        // 3. Mount Stlite
        stlite.mount(
          {
            requirements: ["pandas", "streamlit-calendar"],
            entrypoint: "app.py",
            files: fileMounts,
          },
          document.getElementById("root")
        );
      }

      initApp();
    </script>
  </body>
</html>
